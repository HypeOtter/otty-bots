name: Social link share
on:
  schedule:
    - cron: "17 13,15,17,19,21,23,1,3 * * *"   # every 2 h; script enforces 9 am-11 pm ET + 2 h gap
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore posting hours and 2 h gap"
        type: boolean
        default: false
      dry_run:
        description: "Print captions only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: social-share
jobs:
  share:
    if: github.repository == 'HypeOtter/otty-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Private data (state, manifests)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: HypeOtter/HypeOtter
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: data
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /yt_uploaded.json
            /social/
            /approved/*/manifest.json
      - name: Share new public videos
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          DATA_DIR: ${{ github.workspace }}/data
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 bots/social_share.py
      - name: Save state to private repo
        if: always()
        working-directory: data
        run: |
          [ -f social/shared.json ] || exit 0
          git config user.name "HypeOtter bot"; git config user.email "357183714+HypeOtter@users.noreply.github.com"
          git add social/shared.json
          git commit -q -m "[social] shared state" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*10)); done; exit 1
